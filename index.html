<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lov na zaklad: Postani voda</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:Calibri,"Segoe UI",Arial,sans-serif}
html{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{min-height:100dvh;overflow-x:hidden}
button{font-family:inherit}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% -8%,rgba(191,219,254,.20),transparent 34%),radial-gradient(circle at 10% 92%,rgba(16,185,129,.13),transparent 34%),radial-gradient(circle at 88% 88%,rgba(253,230,138,.12),transparent 28%),linear-gradient(to bottom,#020617,#07132a 55%,#06111f)}
body:after{content:"";position:fixed;inset:auto 0 0 0;height:42dvh;z-index:-2;background:rgba(103,232,249,.08);border-radius:55% 55% 0 0;filter:blur(3px)}
.app{width:100%;min-height:100dvh;display:flex;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.phone{width:min(430px,100%)}
.progress{display:flex;gap:7px;padding:5px 3px 12px;position:sticky;top:0;z-index:20;background:linear-gradient(to bottom,#020617 0%,rgba(2,6,23,.86) 70%,transparent 100%)}
.progress span{height:6px;flex:1;border-radius:999px;background:rgba(255,255,255,.18)}
.progress span.done{background:#22c55e}
.card{position:relative;min-height:calc(100dvh - 86px);border-radius:34px;overflow:hidden;padding:18px;box-shadow:0 24px 90px rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.08);background:var(--card-gradient,linear-gradient(to bottom,rgba(15,23,42,.88),rgba(2,6,23,.90)))}
.card:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 50% 8%,rgba(255,255,255,.16),transparent 20%),radial-gradient(circle at 22% 84%,rgba(103,232,249,.16),transparent 34%),radial-gradient(circle at 86% 86%,rgba(253,230,138,.13),transparent 30%);filter:blur(18px);animation:glow 7s infinite ease-in-out}
.card:after{content:"";position:absolute;left:50%;bottom:-15%;width:125%;height:45%;transform:translateX(-50%);border-radius:55% 55% 0 0;background:rgba(103,232,249,.10);filter:blur(2px)}
.inner{position:relative;z-index:2}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.pill{border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);padding:10px 13px;font-size:12px;line-height:1;font-weight:900;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:rgba(2,6,23,.56);backdrop-filter:blur(14px);border-radius:32px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:18px;text-align:center}
.visual{position:absolute;right:-28px;bottom:2px;width:205px;height:165px;opacity:.14;pointer-events:none}
.visual svg{width:100%;height:100%;overflow:visible}
h1{margin:0;font-size:clamp(30px,8.7vw,42px);line-height:.98;letter-spacing:-.055em;font-weight:950}
h2{margin:14px 0 0;color:rgba(255,255,255,.84);font-size:clamp(17px,4.7vw,20px);line-height:1.2;font-weight:760}
.line{width:112px;height:6px;border-radius:999px;background:rgba(191,219,254,.85);margin:16px auto}
.body,.task,.quote{margin:0;font-size:clamp(17px,4.8vw,21px);line-height:1.25;font-weight:680;color:rgba(255,255,255,.93)}
.quote{font-weight:850;color:#cffafe}
.task{margin-top:16px;padding:14px;border-radius:24px;background:rgba(255,255,255,.10);font-weight:820;text-align:left;white-space:pre-line}
.after{margin:14px 0 0;color:rgba(255,255,255,.72);font-size:16px;line-height:1.25;font-weight:700}
.map-list{display:grid;gap:8px;margin-top:14px}
.level-btn{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(255,255,255,.08);color:white;padding:11px 12px;text-align:left;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.level-btn.unlocked{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.65)}
.level-btn small{display:block;margin-top:3px;font-size:12px;color:rgba(255,255,255,.65);letter-spacing:.08em;text-transform:uppercase}
.lock-msg{margin-top:14px;min-height:24px;color:#fde68a;font-size:15px;font-weight:800}
.action{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;background:white;color:#082f49;padding:11px 14px;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}
.btn.secondary{background:rgba(255,255,255,.12);color:white}
.timer{margin:16px auto 0;width:98px;height:98px;border-radius:999px;border:6px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:28px;font-weight:950;color:white}
.timer.running{animation:pulse 1s infinite ease-in-out}
.checks{display:grid;gap:10px;margin-top:14px}
.check{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:rgba(255,255,255,.10);font-size:16px;font-weight:800;text-align:left;cursor:pointer}
.box{width:28px;height:28px;border-radius:8px;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;flex:0 0 auto}
.check.done .box{background:#22c55e;border-color:#22c55e}
.check.done .box:after{content:"✓";font-weight:950;color:white}
.breath-circle{margin:16px auto 0;width:112px;height:112px;border-radius:999px;background:rgba(191,219,254,.18);border:3px solid rgba(191,219,254,.55);display:grid;place-items:center;font-size:18px;font-weight:950;box-shadow:0 0 45px rgba(103,232,249,.25)}
.breath-circle.animate{animation:breath 10s ease-in-out infinite}
.breath-count{margin-top:12px;color:#cffafe;font-size:18px;font-weight:900}
.footer{display:flex;justify-content:space-between;color:rgba(255,255,255,.68);font-size:14px;padding:10px 4px 0}
.toast{position:fixed;z-index:40;left:22px;right:22px;bottom:22px;background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px;font-weight:850;text-align:center;display:none}
.toast.show{display:block;animation:toast .25s ease both}
@keyframes glow{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes breath{0%,100%{transform:scale(.72);opacity:.65}50%{transform:scale(1.05);opacity:1}}
@keyframes toast{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:700px){.app{align-items:flex-start}.phone{margin-top:14px}}
</style>
</head>
<body>
<div class="app">
  <main class="phone">
    <div class="progress" id="progress"></div>
    <div id="view"></div>
    <div id="toast" class="toast"></div>
    <div class="footer"><span id="footerLeft">Lov na zaklad</span><span id="footerRight">Postani voda</span></div>
  </main>
</div>
<script>
const LEVELS = [{"id": "level1", "key": "L1--6ybJ_cttKk", "kind": "timer", "number": "1", "title": "RESET UMA", "quote": "Tvoj um je kot prepoln telefon. Najprej počisti prostor.", "task": "30 sekund stoj v tišini. Opazuj mirno gladino vode. Brez premikanja. Če se zasmejiš ali premakneš, začneš znova.", "after": "Ko si pripravljen, se s kolesom odpelji do druge postaje.", "duration": 30, "button": "Začni 30 sekund", "theme": "reset"}, {"id": "level2", "key": "L2-YYbyLTPweus", "kind": "checktimer", "number": "2", "title": "OPAZOVALNI IZZIV", "quote": "Koliko podrobnosti spregledaš?", "task": "V 1 minuti najdi:", "checks": ["3 različne barve", "2 različna zvoka", "1 premik: žival, list, veter ali avto"], "after": "Nadaljuj pot s kolesom do naslednje postaje.", "duration": 60, "button": "Začni 1 minuto", "theme": "observe"}, {"id": "level3", "key": "L3-LYI58P_eaxs", "kind": "simple", "number": "3", "title": "OVIRA", "quote": "Ko naletiš na blokado – ali eksplodiraš ali razmišljaš?", "task": "Prehod čez oviro. Pogoj: brez pritoževanja. Če kdo reče/rečeš »to je težko«, ponovi nalogo.", "after": "Ko si pripravljen, se s kolesom odpelji do druge postaje.", "theme": "obstacle"}, {"id": "level4", "key": "L4-fCaN7MnPt7Y", "kind": "breath", "number": "4", "title": "MIRNA GLAVA", "quote": "Močni niso tisti, ki kričijo. Močni so tisti, ki obvladajo sebe.", "task": "10 globokih vdihov, roke so na trebuhu. Telefon naj ostane v žepu.", "after": "", "breaths": 10, "theme": "calm"}, {"id": "level5", "key": "L5-Si8Dr_HzR_k", "kind": "simple", "number": "5", "title": "SPUSTI DRAMO", "quote": "Kaj te največkrat vrže iz ravnotežja?", "task": "Vsak si tiho prizna eno stvar. S prstom simbolno napiše v zrak in “izbriše”.", "after": "", "theme": "release"}, {"id": "final", "key": "FINAL-iff-BNjmtx0", "kind": "final", "number": "FINAL", "title": "ZAKLAD", "quote": "Ustavi se pri skrinjici, v kateri se nahajata besedilo in ogledalo.", "task": "Izprazni svoj um. Bodi nedoločen, brez oblike, kakor voda. Zliješ jo v skodelico in voda postane skodelica. Zliješ jo v čajnik in prevzame obliko čajnika. Zliješ jo v steklenico in postane steklenica. Voda lahko teče, lahko pa tudi dere in ruši!\n\nIn še obljubljeni zaklad:\n\nZaklad si ti.", "after": "", "theme": "treasure"}];

const THEMES={reset:"linear-gradient(to bottom,rgba(2,6,23,.86),rgba(14,116,144,.72),rgba(51,65,85,.86))",observe:"linear-gradient(to bottom,rgba(2,6,23,.86),rgba(6,78,59,.76),rgba(15,118,110,.76))",obstacle:"linear-gradient(to bottom,rgba(2,6,23,.86),rgba(7,89,133,.74),rgba(51,65,85,.86))",calm:"linear-gradient(to bottom,rgba(8,47,73,.86),rgba(14,116,144,.76),rgba(30,58,138,.82))",release:"linear-gradient(to bottom,rgba(2,6,23,.86),rgba(88,28,135,.74),rgba(15,118,110,.76))",treasure:"linear-gradient(to bottom,rgba(2,6,23,.86),rgba(15,118,110,.75),rgba(133,77,14,.72))"};
const STORAGE_KEY="postani_voda_unlocked_v1";let timerId=null,breathId=null,timerRemaining=0,breathCount=0;
function h(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
function getUnlocked(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch(e){return[]}}
function setUnlocked(a){localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(a)]))}
function unlock(id){const a=getUnlocked();if(!a.includes(id)){a.push(id);setUnlocked(a)}}
function isUnlocked(id){return getUnlocked().includes(id)}
function visual(k){if(k==="timer")return`<svg viewBox="0 0 360 240"><rect x="110" y="28" width="140" height="180" rx="28" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.45)" stroke-width="4"/><circle cx="180" cy="174" r="12" fill="rgba(255,255,255,.55)"/><path d="M150 78h60M150 108h40M150 138h65" stroke="rgba(191,219,254,.65)" stroke-width="8" stroke-linecap="round"/><path d="M75 218c70-18 140-18 210 0" stroke="rgba(103,232,249,.35)" stroke-width="6" fill="none"/></svg>`;if(k==="observe")return`<svg viewBox="0 0 360 240"><path d="M40 120c45-62 95-88 140-88s95 26 140 88c-45 62-95 88-140 88S85 182 40 120Z" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="4"/><circle cx="180" cy="120" r="44" fill="rgba(191,219,254,.22)" stroke="rgba(191,219,254,.65)" stroke-width="4"/><circle cx="180" cy="120" r="13" fill="rgba(255,255,255,.7)"/></svg>`;if(k==="obstacle")return`<svg viewBox="0 0 360 240"><path d="M20 170c74-55 124-52 161-22 40 33 90 36 159-16" fill="none" stroke="rgba(103,232,249,.42)" stroke-width="16" stroke-linecap="round"/><ellipse cx="185" cy="150" rx="64" ry="42" fill="rgba(148,163,184,.45)" stroke="rgba(255,255,255,.35)" stroke-width="4"/></svg>`;if(k==="breath")return`<svg viewBox="0 0 360 240"><circle cx="180" cy="120" r="40" fill="none" stroke="rgba(191,219,254,.55)" stroke-width="4"/><circle cx="180" cy="120" r="70" fill="none" stroke="rgba(191,219,254,.42)" stroke-width="4"/><circle cx="180" cy="120" r="100" fill="none" stroke="rgba(191,219,254,.25)" stroke-width="4"/><circle cx="180" cy="120" r="12" fill="rgba(255,255,255,.75)"/></svg>`;if(k==="release")return`<svg viewBox="0 0 360 240"><path d="M80 120c45-45 85-45 120 0s72 46 100 2" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="10" stroke-linecap="round"/><path d="M93 160h172" stroke="rgba(103,232,249,.45)" stroke-width="8" stroke-linecap="round"/><path d="M115 185h130" stroke="rgba(255,255,255,.18)" stroke-width="6" stroke-linecap="round"/></svg>`;return`<svg viewBox="0 0 360 240"><circle cx="180" cy="90" r="55" fill="rgba(253,230,138,.20)" stroke="rgba(253,230,138,.55)" stroke-width="4"/><path d="M95 165c52-20 118-20 170 0M80 200c66-22 134-22 200 0" stroke="rgba(103,232,249,.45)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M155 88l25-43 25 43 45 9-33 32 7 46-44-22-44 22 7-46-33-32 45-9Z" fill="rgba(253,230,138,.45)" stroke="rgba(253,230,138,.8)" stroke-width="3"/></svg>`}
function progress(){document.getElementById("progress").innerHTML=LEVELS.map(l=>`<span class="${isUnlocked(l.id)?"done":""}"></span>`).join("")}
function card(theme,inner){return`<section class="card" style="--card-gradient:${THEMES[theme]||THEMES.treasure}"><div class="inner">${inner}</div></section>`}
function renderMap(msg=""){stopTimer();stopBreath();const u=getUnlocked();const items=LEVELS.map(l=>{const ok=u.includes(l.id);return`<button class="level-btn ${ok?"unlocked":""}" data-id="${l.id}"><span><strong>${l.number==="FINAL"?"FINAL LEVEL":"LEVEL "+l.number}: ${h(l.title)}</strong><small>${ok?"Odklenjeno":"Zaklenjeno – poskeniraj QR"}</small></span><span>${ok?"✅":"🔒"}</span></button>`}).join("");document.getElementById("view").innerHTML=card("treasure",`<div class="top"><span class="pill">LOV NA ZAKLAD</span><span class="pill">POSTANI VODA</span></div><div class="panel"><div class="visual">${visual("treasure")}</div><h1>Lov na zaklad:<br>Postani voda</h1><h2>Legenda pravi, da je največja moč skrita v tistih, ki znajo biti kot voda.</h2><div class="line"></div><p class="body">Da bi jo našel, moraš skozi 6 izzivov.</p><div class="map-list">${items}</div><div class="lock-msg">${msg}</div></div>`);progress();setFooter("Skupna stran",`${u.length} / ${LEVELS.length} odklenjeno`);window.scrollTo(0,0)}
function renderLevel(l){stopTimer();stopBreath();const title=l.number==="FINAL"?"FINAL LEVEL":"LEVEL "+l.number;let extra="";if(l.kind==="timer")extra=`<div class="timer" id="timer">${l.duration}</div><div class="action"><button class="btn" id="startTimer">${h(l.button)}</button><button class="btn secondary" id="resetTimer">Ponovi</button></div>`;if(l.kind==="checktimer")extra=`<div class="timer" id="timer">${l.duration}</div><div class="checks">${l.checks.map(c=>`<div class="check"><span class="box"></span><span>${h(c)}</span></div>`).join("")}</div><div class="action"><button class="btn" id="startTimer">${h(l.button)}</button><button class="btn secondary" id="resetTimer">Ponovi</button></div>`;if(l.kind==="breath")extra=`<div class="breath-circle" id="breathCircle">Vdihni</div><div class="breath-count" id="breathCount">0 / ${l.breaths}</div><div class="action"><button class="btn" id="startBreath">Začni dihanje</button><button class="btn secondary" id="resetBreath">Ponovi</button></div>`;const icon=l.kind==="timer"?"timer":l.kind==="checktimer"?"observe":l.kind==="breath"?"breath":l.theme==="obstacle"?"obstacle":l.theme==="release"?"release":"treasure";document.getElementById("view").innerHTML=card(l.theme,`<div class="top"><span class="pill">${title}</span><span class="pill">Odklenjeno ✅</span></div><div class="panel"><div class="visual">${visual(icon)}</div><h1>${h(l.title)}</h1><p class="quote">»${h(l.quote)}«</p><div class="line"></div><p class="task">${h(l.task)}</p>${l.after?`<p class="after">${h(l.after)}</p>`:""}${extra}<div class="action"><button class="btn secondary" id="backMap">Nazaj na levele</button><button class="btn secondary" id="complete">Označi opravljeno</button></div></div>`);progress();setFooter(title,"Izziv odklenjen");document.getElementById("backMap").onclick=()=>{history.replaceState(null,"",location.pathname);renderMap()};document.getElementById("complete").onclick=()=>{unlock(l.id);toast("Level označen kot opravljen.");progress()};if(document.getElementById("startTimer"))document.getElementById("startTimer").onclick=()=>startTimer(l.duration);if(document.getElementById("resetTimer"))document.getElementById("resetTimer").onclick=()=>resetTimer(l.duration);if(document.getElementById("startBreath"))document.getElementById("startBreath").onclick=()=>startBreath(l.breaths);if(document.getElementById("resetBreath"))document.getElementById("resetBreath").onclick=()=>resetBreath(l.breaths);document.querySelectorAll(".check").forEach(ch=>ch.onclick=()=>ch.classList.toggle("done"));window.scrollTo(0,0)}
function setFooter(l,r){document.getElementById("footerLeft").textContent=l;document.getElementById("footerRight").textContent=r}
function startTimer(d){stopTimer();timerRemaining=d;const el=document.getElementById("timer");if(!el)return;el.classList.add("running");el.textContent=timerRemaining;timerId=setInterval(()=>{timerRemaining--;el.textContent=timerRemaining;if(timerRemaining<=0){stopTimer();el.textContent="✓";toast("Čas je potekel. Izziv je opravljen, če si upošteval navodila.")}},1000)}
function resetTimer(d){stopTimer();const el=document.getElementById("timer");if(el)el.textContent=d}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;const el=document.getElementById("timer");if(el)el.classList.remove("running")}
function startBreath(max){stopBreath();breathCount=0;const c=document.getElementById("breathCircle"),n=document.getElementById("breathCount");if(!c||!n)return;c.classList.add("animate");c.textContent="Vdihni";n.textContent="0 / "+max;let phase=0;breathId=setInterval(()=>{phase++;if(phase%2===1)c.textContent="Izdihni";else{breathCount++;n.textContent=breathCount+" / "+max;c.textContent="Vdihni";if(breathCount>=max){stopBreath();c.textContent="✓";toast("Dihanje zaključeno.")}}},5000)}
function resetBreath(max){stopBreath();const c=document.getElementById("breathCircle"),n=document.getElementById("breathCount");if(c)c.textContent="Vdihni";if(n)n.textContent="0 / "+max}
function stopBreath(){if(breathId)clearInterval(breathId);breathId=null;const c=document.getElementById("breathCircle");if(c)c.classList.remove("animate")}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function handleHash(){const hash=decodeURIComponent(location.hash.replace(/^#/,""));if(!hash)return renderMap();const l=LEVELS.find(x=>hash===x.key||hash==="unlock-"+x.key);if(l){unlock(l.id);renderLevel(l);return}const d=LEVELS.find(x=>hash===x.id);if(d&&isUnlocked(d.id))renderLevel(d);else renderMap("Ta level še ni odklenjen. Poišči in poskeniraj pravo QR kodo.")}
document.addEventListener("click",e=>{const b=e.target.closest(".level-btn");if(!b)return;const l=LEVELS.find(x=>x.id===b.dataset.id);if(!l)return;if(isUnlocked(l.id))renderLevel(l);else renderMap("Ta level še ni odklenjen. Poišči in poskeniraj pravo QR kodo.")});
window.addEventListener("hashchange",handleHash);handleHash();

</script>
</body>
</html
