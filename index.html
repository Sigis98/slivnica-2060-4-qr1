/* ROBUST MOBILE SCROLL FIX */
html, body {
  overflow-x: hidden !important;
  overflow-y: auto !important;
  min-height: 100% !important;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}
body {
  min-height: 100dvh !important;
}
.app {
  min-height: 100dvh !important;
  height: auto !important;
  align-items: flex-start !important;
  overflow: visible !important;
}
.phone {
  min-height: auto !important;
  height: auto !important;
}
.stage {
  position: relative !important;
  flex: none !important;
  min-height: calc(100dvh - 72px) !important;
  height: auto !important;
  overflow: visible !important;
}
.screen {
  position: relative !important;
  inset: auto !important;
  min-height: calc(100dvh - 72px) !important;
  height: auto !important;
  overflow: visible !important;
  display: none;
}
.screen.active {
  display: block !important;
}
.content {
  height: auto !important;
  min-height: auto !important;
  display: block !important;
  padding: 14px 18px 28px !important;
}
.panel {
  margin-bottom: 28px !important;
}
.bg {
  position: fixed !important;
  inset: 0 !important;
}
.toast {
  position: fixed !important;
}
.footer {
  padding-bottom: 10px !important;
}
.visual {
  position: absolute !important;
  inset: auto -26px 6px auto !important;
  width: 205px !important;
  height: 165px !important;
  opacity: .14 !important;
  z-index: -1 !important;
  pointer-events: none !important;
}
.map-list {
  gap: 8px !important;
}
.level-btn {
  padding: 11px 12px !important;
}
@media (max-height: 760px) {
  .stage,
  .screen {
    min-height: calc(100dvh - 66px) !important;
  }
  .content {
    padding-top: 10px !important;
  }
}


/* FULL HEIGHT BACKGROUND FIX */
.stage {
  overflow: visible !important;
  background: transparent !important;
}
.screen {
  position: relative !important;
  overflow: visible !important;
  background: transparent !important;
}
.screen.active {
  display: block !important;
}
.screen > .bg {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: auto !important;
  min-height: 100% !important;
  border-radius: 34px !important;
  z-index: 0 !important;
}
.screen > .bg::before,
.screen > .bg::after {
  position: absolute !important;
}
.content,
.top {
  position: relative !important;
  z-index: 2 !important;
}
.panel {
  position: relative !important;
  z-index: 3 !important;
}
html,
body {
  background: #020617 !important;
}
.app {
  background:
    radial-gradient(circle at 50% -8%, rgba(191,219,254,.16), transparent 34%),
    radial-gradient(circle at 10% 95%, rgba(16,185,129,.10), transparent 30%),
    #020617 !important;
}
